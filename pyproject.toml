# Tooling only: the integration ships through HACS as custom_components/casasmart,
# so nothing here is packaged. Home Assistant 2025.3+ runs on Python 3.13.

[tool.ruff]
target-version = "py313"
line-length = 88
# deploy/macos is run in place by launchd on the macOS LAN bridge host; it is
# kept byte-stable and is not reformatted.
extend-exclude = ["deploy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# E501: the formatter owns code line length; long prose lines in docstrings and
# comments are allowed. The SIM rules below would only restructure working code.
ignore = ["E501", "SIM102", "SIM105", "SIM117"]

[tool.ruff.lint.per-file-ignores]
# Test idioms: unused unpacked results, list defaults on fake classes,
# assertRaises(Exception) around deliberately broken fakes.
"tests/**" = ["RUF005", "RUF012", "RUF015", "RUF059", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
