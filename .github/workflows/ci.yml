name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.16.10"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q

  # The same suite against a real Home Assistant, so the ~150 view-layer tests
  # that skip under the stubs run too.
  test-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # PyTurboJPEG and numpy are the camera/stream requirements the
      # integration's package import pulls in.
      - run: >-
          pip install "homeassistant==2026.9.4" -r requirements_test.txt
          "paho-mqtt>=1.6.1" "prayer-times-calculator-offline>=1.0.3"
          PyTurboJPEG numpy
      - run: python -m pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  # HACS installs by release tag while Home Assistant reports manifest.json's
  # version: a tag that disagrees with the manifest it ships must never build.
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version custom_components/casasmart/manifest.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match manifest.json version $manifest"
            exit 1
          fi
