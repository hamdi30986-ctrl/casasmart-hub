factory_reset:
  name: Factory reset (app layer)
  description: >-
    Unpair every app and wipe the CasaSmart app layer: pairing and recovery
    codes (the printed codes rotate), favorites, scenes, settings, Now and
    suggestion data, push tokens, HQ notifications and the trusted HQ key, the
    alarm log and armed state, audio and Energy Saving data, room tags, and
    the floors, rooms and device grouping, which re-seed from Home Assistant on
    reload. Keeps tanks, alarm zones and settings, the hub's identity, relay
    registration and tunnel settings, and every Home Assistant device and
    automation.
set_tunnel_url:
  name: Set tunnel URL
  description: >-
    Validate and store the HTTPS tunnel origin advertised by the hub.
  fields:
    url:
      name: Tunnel URL
      description: The hub's public https tunnel origin (e.g. https://abc123.example.com).
      required: true
      example: https://abc123.example.com
      selector:
        text:
activate_scene:
  name: Activate CasaSmart scene
  description: >-
    Run a CasaSmart registry scene through the same validated executor used by
    the owner app. Intended for CasaSmart-created Home Assistant automations.
  fields:
    scene_id:
      name: Scene ID
      description: Stable CasaSmart registry scene identifier.
      required: true
      example: scene-AbCdEf123
      selector:
        text:
configure_hq_notifications:
  name: Configure HQ notifications
  description: >-
    Trust the Ed25519 public key of an external HQ reminder sender (for example
    a household or installer dashboard). Its signed requests become content-free
    "private update" pushes to the owner. Requires a Home Assistant
    administrator.
  fields:
    public_key:
      name: HQ notification public key
      description: PEM-encoded Ed25519 public key. Never submit a private key.
      required: true
      selector:
        text:
          multiline: true
    sender_name:
      name: Sender name
      description: >-
        Title of the reminder pushes on the owner's phone (one line, up to 40
        characters). Leave empty for "CasaSmart HQ".
      required: false
      example: Family HQ
      selector:
        text:
